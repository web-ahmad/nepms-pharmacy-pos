# Pharvix — nginx reverse proxy.
#
# Everything is served from one origin (https://pharvix.devjix.com):
#   /api/v1/*  and /storage/*  -> backend
#   everything else            -> the Next.js server
# Because the API is same-origin, the browser never makes a cross-origin
# request and CORS never enters the picture.

upstream pharvix_backend  { server backend:8000; }
upstream pharvix_frontend { server frontend:3000; }

# Port 80: ACME challenge, and redirect everything else to HTTPS.
server {
    listen 80;
    server_name pharvix.devjix.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name pharvix.devjix.com;

    ssl_certificate     /etc/letsencrypt/live/pharvix.devjix.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pharvix.devjix.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # Medicine images, CSV imports and document uploads — the default 1m is
    # small enough that a normal product photo would 413.
    client_max_body_size 25m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/v1/ {
        proxy_pass         http://pharvix_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Report generation and CSV import run inline on the request.
        proxy_read_timeout 300s;
    }

    location /storage/ {
        proxy_pass       http://pharvix_backend;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /health {
        proxy_pass       http://pharvix_backend;
        access_log       off;
    }

    location / {
        proxy_pass         http://pharvix_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Next.js dev/HMR and any future websocket route.
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}
