# Temporary config used ONLY to obtain the first certificate.
#
# pharvix.conf references /etc/letsencrypt/live/pharvix.devjix.com/fullchain.pem,
# which does not exist yet on a fresh server — nginx refuses to start without it,
# and certbot's webroot challenge needs a running nginx. This breaks that loop:
# serve plain HTTP long enough for certbot to answer the challenge, then swap
# back to pharvix.conf.
#
# See deploy/README.md step 6.

server {
    listen 80;
    server_name pharvix.devjix.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass       http://frontend:3000;
        proxy_set_header Host $host;
    }
}
